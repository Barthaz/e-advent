# Konfiguracja Nginx dla React Router (SPA)
# Skopiuj odpowiednią część do swojej konfiguracji Nginx

server {
    listen 80;
    # listen 443 ssl http2; # Odkomentuj jeśli używasz HTTPS
    server_name e-advent.pl www.e-advent.pl; # Zmień na swoją domenę
    
    root /var/www/e-advent/dist; # Zmień na ścieżkę do folderu dist
    index index.html;
    
    # Kompresja GZIP
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    
    # Cache dla plików statycznych
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Główna konfiguracja - przekierowanie wszystkich ścieżek do index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Opcjonalnie: przekierowanie HTTP na HTTPS
    # if ($scheme != "https") {
    #     return 301 https://$host$request_uri;
    # }
    
    # SSL (jeśli używasz HTTPS - odkomentuj)
    # ssl_certificate /path/to/certificate.crt;
    # ssl_certificate_key /path/to/private.key;
}
